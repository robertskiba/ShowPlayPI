# ShowPlayPI: the SHOWPLAYPI drive (media partition) as network share
#   Windows: \<device name>.local\SHOWPLAYPI     Mac: smb://<device name>.local/SHOWPLAYPI
#   User name admin, password admin (intentionally simple, like the other defaults).
# Switched on and off through [NETWORK_SHARE] in showplaypi.ini (showplaypi-system-config).
# While a computer uses the drive over USB-C, the share pauses (showplaypi-media).

[global]
    server string = ShowPlayPI
    workgroup = WORKGROUP
    server role = standalone server
    security = user
    map to guest = never
    # Found through mDNS (Avahi) and WS-Discovery (wsdd2) instead of NetBIOS
    disable netbios = yes
    smb ports = 445
    server min protocol = SMB2_10
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    # No shares created by users (only SHOWPLAYPI)
    usershare path =
    logging = systemd
    # exFAT has no extended attributes
    ea support = no
    store dos attributes = no
    # ShowPlayPI itself writes to the drive (Companion backups, restored files): without directory leases
    # Windows asks for the folder contents again instead of showing a cached, outdated list
    smb3 directory leases = no
    map archive = no

[SHOWPLAYPI]
    comment = ShowPlayPI drive
    path = /media/showplaypi
    valid users = admin
    read only = no
    force user = admin
    force group = admin
    create mask = 0644
    directory mask = 0755
    # Windows may start programs from the share (the configurator); the drive has no execute bits
    acl allow execute always = yes
