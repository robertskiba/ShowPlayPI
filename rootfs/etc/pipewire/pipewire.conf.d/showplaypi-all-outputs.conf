# ShowPlayPI: one sound output that plays on every output at the same time – both HDMI ports, the headphone
# jack (Pi 4) and USB sound cards, also when they are plugged in later. It is the default output, so the
# browser, the video player and the audio player all use it.
#
# The signal is stereo. On sound cards with more channels it goes to outputs 1-2 only (no upmix to the
# other channels). Outputs that cannot play (e.g. an HDMI port without a display that takes audio) are
# left out by PipeWire without affecting the others.
context.modules = [
    {
        name = libpipewire-module-combine-stream
        args = {
            combine.mode = sink
            node.name = "showplaypi_all_outputs"
            node.description = "ShowPlayPI – all outputs"
            combine.latency-compensate = false
            combine.props = {
                audio.position = [ FL FR ]
                # Preferred as default output by WirePlumber
                priority.session = 10000
                priority.driver = 10000
            }
            stream.props = {
                audio.position = [ FL FR ]
                # Channels 1-2 only on multi-channel sound cards
                channelmix.upmix = false
            }
            stream.rules = [
                {
                    matches = [
                        {
                            media.class = "Audio/Sink"
                            node.name = "~alsa_output.*"
                        }
                    ]
                    actions = {
                        create-stream = { }
                    }
                }
            ]
        }
    }
]
