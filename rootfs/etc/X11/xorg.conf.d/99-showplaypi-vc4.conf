# Raspberry Pi 4/5: use the display controller (vc4) for output, not the 3D unit (v3d).
# Without this, Xorg on the Pi 5 stops with "Cannot run in framebuffer mode".
Section "OutputClass"
    Identifier "ShowPlayPI vc4 display"
    MatchDriver "vc4"
    Driver "modesetting"
    Option "PrimaryGPU" "true"
EndSection
