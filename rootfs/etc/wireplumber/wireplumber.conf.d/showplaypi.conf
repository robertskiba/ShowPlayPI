# ShowPlayPI: every sound output (HDMI, headphone jack, USB sound card) always at full level. The volume is
# set centrally (video player, audio player, OSC), never per output – and nothing is remembered from a
# previous session, so the device behaves the same after every start.
wireplumber.settings = {
    device.routes.default-sink-volume = 1.0
    device.restore-routes = false
    node.stream.restore-props = false
    node.stream.restore-target = false
    node.restore-default-targets = false
}
