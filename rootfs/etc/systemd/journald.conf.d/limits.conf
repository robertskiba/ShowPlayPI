# The log never fills the Linux partition. Entries older than 14 days (e.g. visited addresses) are removed by
# showplaypi-journal-cleanup (daily, showplaypi-data-hygiene.service) – not by MaxRetentionSec: right after a
# start without a clock, entries are dated too early, and MaxRetentionSec removed the log of the whole start
# as soon as the clock was set. A file per day lets the cleanup remove old days.
[Journal]
SystemMaxUse=100M
MaxFileSec=1day
