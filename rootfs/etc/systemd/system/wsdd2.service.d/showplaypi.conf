# Announce the device in the Windows network view only together with the share,
# with manufacturer and model in its properties
[Unit]
After=smbd.service
BindsTo=smbd.service

[Service]
ExecStart=
# One -b per value: wsdd2 keeps the comma of combined values and rejects URLs (":" in the value)
ExecStart=/usr/sbin/wsdd2 -b vendor:konftools -b model:ShowPlayPI
