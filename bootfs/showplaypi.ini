; =============================================================================
; ShowPlayPI Configuration
; =============================================================================
;
; Edit this file with a plain-text editor.
; Save the file as UTF-8.
; Changes are applied after restarting ShowPlayPI.
;
; Lines beginning with ";" or "#" are comments.
; Section names and setting names must not be changed.
;
; =============================================================================


; -----------------------------------------------------------------------------
; System settings
; -----------------------------------------------------------------------------

[SYSTEM]

; Operating mode (takes effect after a restart):
; browser   = full-screen web page (section [BROWSER])
; video     = videos and still images from the folder VIDEO on the drive
;             SHOWPLAYPI (section [VIDEO])
; companion = Bitfocus Companion runs on the device; the screen shows its
;             emulator chooser. Set up Companion in a browser at
;             http://<device name>.local:8000 - its own OSC receiver, if
;             enabled there, must not use port 23878 (ShowPlayPI)
; ontime    = Ontime runs on the device; the screen shows its timer
;             (section [ONTIME])
MODE=browser

; Device name used on the network.
; showplaypi = automatic: "showplaypi-" plus the last six digits of the
; MAC address, e.g. showplaypi-e84042 (unique for every device).
; The device is reachable as <name>.local, e.g. showplaypi-e84042.local.
; The name is shown on the setup page.
; Letters, digits and hyphens - other characters such as _ or a space
; become a hyphen (stage_left becomes stage-left).
HOSTNAME=showplaypi

; Time zone.
; auto = detected from the internet connection at every start (the public
;        IP address is sent to a free service, ip-api.com or ipapi.co);
;        without internet the last detected time zone is kept, at first
;        Europe/Berlin
; Or a Linux time zone name, which is always used as it is, e.g.:
; Europe/Berlin
; Europe/London
; America/New_York
; Asia/Tokyo
TIMEZONE=auto

; NTP server used for automatic time synchronisation.
; The default is a public time server operated by PTB in Germany.
; An IP address avoids dependency on DNS. Public time servers and time
; servers announced by the router (DHCP) are used as a reserve.
; Without any time server the clock never starts earlier than the last
; known time: the time saved while running or the time a computer last
; saved this file on the drive SHOWPLAYPI.
NTP_SERVER=192.53.103.108

; USB configuration mode while a computer is connected via USB-C.
; yes = playback pauses and a status screen is shown while the computer uses
;       the drive SHOWPLAYPI; after unplugging the cable ShowPlayPI restarts
;       with the new settings (when powered by PoE or its power supply).
; no  = playback continues (the drive SHOWPLAYPI is still handed to the
;       computer, local pages from it are not available meanwhile).
USB_CONFIG_MODE=yes

; Show the system messages on the screen while ShowPlayPI starts,
; instead of the startup image (for troubleshooting).
; A change restarts ShowPlayPI once more automatically.
; Available values: yes, no
BOOT_MESSAGES=no


; -----------------------------------------------------------------------------
; Ethernet network settings
; -----------------------------------------------------------------------------

[NETWORK]

; Available modes:
; dhcp   = obtain the network configuration automatically
; static = use the settings entered below
MODE=dhcp

; Static IPv4 address.
; Used only when MODE=static.
IP=

; IPv4 subnet mask.
; Used only when MODE=static.
NETMASK=255.255.255.0

; IPv4 default gateway.
; May remain empty in an isolated local network.
GATEWAY=

; Primary DNS server.
; May remain empty when DNS is not required.
DNS1=

; Secondary DNS server. Default: 8.8.8.8 (Google Public DNS).
; In DHCP mode both servers are added to the ones received via DHCP.
; May remain empty.
DNS2=8.8.8.8


; -----------------------------------------------------------------------------
; Browser settings
; -----------------------------------------------------------------------------

[BROWSER]

; Website or local page opened in kiosk mode.
; Supported address types:
; http://
; https://
; file://
;
; Empty = the default page: the local setup page, in companion mode the
; Companion emulator chooser, in ontime mode the Ontime view ([ONTIME]).
URL=

; Ignore invalid, expired or self-signed HTTPS certificates.
; Available values: yes, no
IGNORE_CERTIFICATE_ERRORS=yes

; Enable website availability monitoring.
; Available values: yes, no
WATCHDOG_ENABLED=yes

; Number of seconds between website availability checks.
; Valid range: 2 to 300 seconds
WATCHDOG_INTERVAL=5

; Reload the website automatically after this number of seconds.
; Use 0 to disable periodic reloads.
;
; Examples:
; 60   = every minute
; 300  = every five minutes
; 3600 = every hour
RELOAD_INTERVAL=0

; Return to the start page after this number of seconds without touch,
; mouse or keyboard input. Use 0 to disable. Recommended for kiosks: 60 to 300.
; A page set via OSC (/showplaypi/browser/url) is the start page until the next restart.
IDLE_TIMEOUT=0

; What happens after the idle timeout:
; home   = open the start page again if the visitor has left it
; reload = always reload the start page after it was used
;          (also resets web apps whose address does not change)
IDLE_ACTION=home

; Clear cookies, form data and logins when resetting.
; Recommended for public kiosks.
; Available values: yes, no
IDLE_CLEAR_SESSION=no


; -----------------------------------------------------------------------------
; Video settings (MODE=video)
; -----------------------------------------------------------------------------
;
; Put videos (MP4, MOV, MKV, WebM ...) and still images (JPG, PNG, WebP) into
; the folder VIDEO on the drive SHOWPLAYPI. They play in alphabetical order in
; an endless loop, e.g. 010_Intro.mp4, 020_Sponsors.jpg, 030_Trailer.mp4.
; Best video format: H.265/HEVC (decoded in hardware). On the Raspberry Pi 5,
; H.264 videos should not exceed 1080p with 30 frames per second.
; Subfolders of VIDEO are additional playlists (selectable via OSC).
; A still image shows for STILL_DURATION seconds, or for the time in its
; file name: "020_Sponsors [15sec].jpg" (also [15s]).

[VIDEO]

; Start playing automatically after ShowPlayPI has started.
; no = the screen stays black until a play command arrives via OSC.
; Available values: yes, no
AUTOSTART=yes

; Playlist played after the start: VIDEO or the name of a subfolder.
PLAYLIST=VIDEO

; Transition between two entries:
; crossfade = blend into the next entry (in preparation - fades through
;             black for now)
; black     = fade to black and in again
TRANSITION=crossfade

; Fade time in milliseconds (1000 = one second). 0 = hard cut.
FADE=1000

; Default display time of still images in seconds.
STILL_DURATION=10

; Scaling of still images:
; fit  = whole image visible, black bars where the aspect ratio differs
; fill = screen filled completely, edges cut off where necessary
STILL_FIT=fit

; Volume of the videos in percent (0 to 100).
VOLUME=100


; -----------------------------------------------------------------------------
; Audio player (optional, in every mode)
; -----------------------------------------------------------------------------
;
; Jingles: audio files in the folder AUDIO on the drive SHOWPLAYPI, played on
; command (OSC), e.g. from a Companion button.
; Background music: the folder AUDIO/LOOP is playlist 1; its subfolders are
; further playlists. Files play in alphabetical order.
; Formats: WAV, MP3, FLAC, OGG/Opus, M4A/AAC. The sound plays on all outputs
; at once (HDMI, headphone jack of the Pi 4, USB sound card).

[AUDIO]

; Switch the audio player on (it runs next to the chosen mode).
; Available values: yes, no
ENABLED=no

; Start playlist 1 (AUDIO/LOOP) automatically after ShowPlayPI has started.
; no = the audio player waits for a command (OSC).
; Available values: yes, no
AUTOSTART=no

; Volumes in percent (0 to 100): all audio, the playlist, the jingles.
VOLUME=100
LOOP_VOLUME=80
JINGLE_VOLUME=100

; What the playlist does while a jingle plays:
; duck  = it gets quieter (DUCK_LEVEL percent of its volume)
; pause = it pauses
; Afterwards it continues automatically.
JINGLE_MODE=duck
DUCK_LEVEL=30

; Repeat the playlist: all = endless loop, one = the current track, off = once
REPEAT=all

; Play the playlist in random order.
; Available values: yes, no
SHUFFLE=no


; -----------------------------------------------------------------------------
; Ontime settings (MODE=ontime)
; -----------------------------------------------------------------------------
;
; Ontime runs on ShowPlayPI. Its editor: http://<device name>.local:4001
; Ontime's own OSC input, if enabled in Ontime, must not use port 23878.

[ONTIME]

; Ontime view on the screen: timer, backstage, countdown, studio or timeline.
; Options from the view's settings can follow after "?", e.g.
; backstage?stopCycle=true&extra-info=0-Custom+data
VIEW=timer


; -----------------------------------------------------------------------------
; Display settings
; -----------------------------------------------------------------------------

[DISPLAY]

; Available modes:
; auto  = use the connected display's preferred EDID mode
;         and use the fallback mode when no display is detected
; fixed = always use RESOLUTION and REFRESH
MODE=auto

; Default mode used when no display or no usable EDID is detected.
FALLBACK=1920x1080@60

; Resolution used when MODE=fixed.
RESOLUTION=1920x1080

; Refresh rate used when MODE=fixed.
REFRESH=60


; -----------------------------------------------------------------------------
; VNC remote access
; -----------------------------------------------------------------------------

[VNC]

; Enable access to the actual kiosk display using a VNC viewer.
; Available values: yes, no
ENABLED=yes

; TCP port used by the VNC server.
; Default VNC port: 5900
PORT=5900


; -----------------------------------------------------------------------------
; Network share
; -----------------------------------------------------------------------------

[NETWORK_SHARE]

; Share the SHOWPLAYPI drive (configuration, HTML, VIDEO, AUDIO, PRESETS)
; on the local network.
; Windows: \\<device name>.local\SHOWPLAYPI    Mac: smb://<device name>.local/SHOWPLAYPI
; User name: admin, password: admin
; Available values: yes, no
ENABLED=yes


; -----------------------------------------------------------------------------
; Time server for the network
; -----------------------------------------------------------------------------

[TIME_SERVER]

; Serve the time to every device on the network (NTP, UDP port 123): other
; devices can use ShowPlayPI as their time server, e.g. in a network without
; internet. Without an external time source the device serves its own clock
; with a low priority, so devices with a better source ignore it.
; Available values: yes, no
ENABLED=yes


; -----------------------------------------------------------------------------
; Discovery on the network
; -----------------------------------------------------------------------------

[DISCOVERY]

; Announce the running web interfaces (Companion, Ontime) via UPnP, so they
; appear in Windows under "Network" and open with a double-click.
; Available values: yes, no
UPNP=yes


; -----------------------------------------------------------------------------
; OSC remote control
; -----------------------------------------------------------------------------

[OSC]

; Enable remote control via OSC (e.g. from Bitfocus Companion).
; Available values: yes, no
ENABLED=yes

; UDP port for OSC commands. This port is fixed and cannot be changed.
; Changes made via OSC only last until the next restart.
PORT=23878
